name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          # One target at a time, two jobs. A full parallel build compiles JUCE twice
          # at once and the Linux runner is stopped mid-compile.
          cmake --build build --config Release --parallel 2 --target squeeze_tests
          cmake --build build --config Release --parallel 2 --target SQUEEZE_VST3
          cmake --build build --config Release --parallel 2 --target SQUEEZE_Standalone

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.7

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Confirm the bundles are universal
        run: |
          lipo -info build/SQUEEZE_artefacts/Release/AU/SQUEEZE.component/Contents/MacOS/SQUEEZE
          lipo -info build/SQUEEZE_artefacts/Release/VST3/SQUEEZE.vst3/Contents/MacOS/SQUEEZE
          lipo -info build/SQUEEZE_artefacts/Release/AU/SQUEEZE.component/Contents/MacOS/SQUEEZE | grep -q arm64
          lipo -info build/SQUEEZE_artefacts/Release/AU/SQUEEZE.component/Contents/MacOS/SQUEEZE | grep -q x86_64

      - name: pluginval strictness 5
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          ditto -xk pluginval.zip pluginval-tool
          PLUGINVAL=$(find pluginval-tool -type f -name pluginval | head -n 1)
          "$PLUGINVAL" --strictness-level 5 --verbose --validate-in-process --timeout-ms 300000 --output-dir build/pluginval \
            "build/SQUEEZE_artefacts/Release/VST3/SQUEEZE.vst3"

      - name: Upload AU and VST3
        uses: actions/upload-artifact@v4
        with:
          name: SQUEEZE-macOS-universal
          if-no-files-found: error
          path: |
            build/SQUEEZE_artefacts/Release/AU/SQUEEZE.component
            build/SQUEEZE_artefacts/Release/VST3/SQUEEZE.vst3

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.15-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
